services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1


  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_USER: usuario
      CLICKHOUSE_PASSWORD: senha123
      CLICKHOUSE_DB: telemetria


  producer:
    build: .
    container_name: producer_telemetria

    command: python producer/gerador_eventos.py

    environment:
      KAFKA_SERVER: kafka:19092
      KAFKA_TOPIC: telemetria-veiculos

    depends_on:
      - kafka

    restart: on-failure


  consumer:
    build: .
    container_name: consumer_telemetria

    command: python consumer/consumer_eventos.py

    environment:
      KAFKA_SERVER: kafka:19092
      KAFKA_TOPIC: telemetria-veiculos

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: usuario
      CLICKHOUSE_PASSWORD: senha123
      CLICKHOUSE_DATABASE: telemetria

    depends_on:
      - kafka
      - clickhouse

    restart: on-failure


  api:
    build: .
    container_name: api_telemetria

    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8001:8000"

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: usuario
      CLICKHOUSE_PASSWORD: senha123
      CLICKHOUSE_DATABASE: telemetria

    depends_on:
      - clickhouse

    restart: on-failure